[templates]
SDT_BOOL                = SDT_BOOL(GameSettings, $var, SettingFlags({$flags}), $def, $str, $strhelp, $strval, $pre_cb, $post_cb, $str_cb, $help_cb, $val_cb, $def_cb, $from, $to, $extver, $cat, $guiproc, $startup, $patxname);
SDT_VAR                 = SDT_VAR(GameSettings, $var, $type, SettingFlags({$flags}), $def, $min, $max, $interval, $str, $strhelp, $strval, $pre_cb, $post_cb, $str_cb, $help_cb, $val_cb, $def_cb, $range_cb, $from, $to, $extver, $cat, $guiproc, $startup, $patxname);
SDT_ENUM                = SDT_ENUM(GameSettings, $var, $type, SettingFlags({$flags}), $def,                       $str, $strhelp,          $pre_cb, $post_cb, $str_cb, $help_cb, $val_cb, $def_cb,            $from, $to, $extver, $cat, $guiproc, $startup, $patxname, $enumlist);
SDT_NAMED_NULL          = SDT_NAMED_NULL($name, $length, $from, $to, $extver, $patxname);
SDT_LINKGRAPH_PER_CARGO = SDT_ENUM(GameSettings, linkgraph.distribution_per_cargo[$linkgraph_cargo], SLE_UINT8, SettingFlags({$flags}) | SettingFlags({SettingFlag::NotInConfig, SettingFlag::NoNewgame, SettingFlag::Patch}), DistributionType::PerCargoDefault, STR_CONFIG_SETTING_DISTRIBUTION_PER_CARGO, STR_CONFIG_SETTING_DISTRIBUTION_PER_CARGO_HELPTEXT, $pre_cb, PassengerOdSettingsChanged, $str_cb, $help_cb, $val_cb, $def_cb, $from, $to, SlXvFeatureTest(XSLFTO_AND, XSLFI_LINKGRAPH_MODES), SC_EXPERT, LinkGraphDistributionSettingGUI, false, nullptr, _linkgraph_mode_per_cargo);

[validation]
SDT_VAR = static_assert(DoesMaxFitVariable($max, $type), "Maximum value for GameSettings.$var exceeds storage size");

